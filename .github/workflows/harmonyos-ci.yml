name: HarmonyOS CI

on:
  push:
    branches: [main, openharmony_master]
    tags: ['*']
  pull_request:
    branches: [main, openharmony_master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build review artifacts
    runs-on: ubuntu-latest
    container: ghcr.io/bytemain/harmony-next-pipeline-docker/harmonyos-ci-image:v6.0.2.642
    steps:
      - uses: actions/checkout@v4
      - name: Check source text for emoji
        run: |
          node scripts/check-no-emoji.mjs --self-test
          node scripts/check-no-emoji.mjs
          node scripts/check-no-emoji.mjs website/dist
      - name: Verify result gate
        run: node --test scripts/verify-hypium-results.test.mjs scripts/run-hypium-tests.test.mjs
      - name: Install dependencies
        run: ohpm install --all
      - name: Build debug HAP
        run: |
          hvigorw clean --no-daemon
          hvigorw assembleHap --mode module -p product=default -p buildMode=debug --no-daemon
      - name: Save debug HAP for review
        uses: actions/upload-artifact@v4
        with:
          name: debug-hap
          path: entry/build/default/outputs/default/*.hap
          if-no-files-found: error
      - name: Build release APP
        run: hvigorw assembleApp --mode project -p product=default -p buildMode=release --no-daemon
      - name: Save release APP for review
        uses: actions/upload-artifact@v4
        with:
          name: release-app
          path: build/outputs/default/*.app
          if-no-files-found: error
      - name: Explain artifact status
        run: |
          echo 'Build artifacts are for review. Without configured signing material they are unsigned. No store upload or public GitHub Release was performed.' >> "$GITHUB_STEP_SUMMARY"

  # Job ID stays `test`; update any required status-check names to this explicit label.
  test:
    name: Compile native tests (NOT executed)
    runs-on: ubuntu-latest
    container: ghcr.io/bytemain/harmony-next-pipeline-docker/harmonyos-ci-image:v6.0.2.642
    env:
      HYPIUM_COMPILE_ONLY: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: ohpm install --all
      - name: Compile unit tests only
        run: hvigorw test --mode module -p product=default --no-daemon
      - name: Explain execution limit
        run: |
          echo 'Native Hypium cases were NOT executed. This Linux image has no DevEco Previewer. Run the Native unit tests workflow on a configured macOS runner before release.' >> "$GITHUB_STEP_SUMMARY"
